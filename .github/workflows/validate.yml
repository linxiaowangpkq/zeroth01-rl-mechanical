name: validate-physical-mount-v1

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: pip install -r requirements-validation.txt
      - run: python scripts/validate_release.py
      - run: python cad/physical_mount_v1/validate_physical_mount_v1.py --random-samples 1000

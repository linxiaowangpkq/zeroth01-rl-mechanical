name: validate

on:
  push:
  pull_request:

jobs:
  mechanical-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python scripts/validate_rl_package_portability.py --urdf generated/urdf/zeroth01_rl_round_v1.urdf --mjcf generated/mujoco/zeroth01_rl_round_v1.xml
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/smoke_test_round_v1_mujoco.py

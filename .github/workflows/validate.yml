name: validate-physical-mount-v2-minimal

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: pip install -r requirements-validation.txt
      - run: python scripts/validate_minimal_v2_release.py
